# ============================================================================
# InfraScope - Docker Compose Configuration (Production)
# ============================================================================

version: '3.9'

services:
  # PostgreSQL Database Service (Production)
  db:
    image: postgres:15-alpine
    container_name: ${INFRASCOPE_CONTAINER_PREFIX:-infrascope}-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # Production: Security and performance settings
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      # Backup script (optional)
      - ./docker/postgres-backup.sh:/usr/local/bin/backup-db.sh:ro
    networks:
      - infrascope-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    # No exposed ports - only internal network
    ports:
      - "127.0.0.1:5432:5432"

  # Next.js Web Application (Production)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: ${INFRASCOPE_CONTAINER_PREFIX:-infrascope}-web-prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      FORTIGATE_REQUEST_TIMEOUT_MS: ${FORTIGATE_REQUEST_TIMEOUT_MS:-15000}
      INTEGRATION_CREDENTIALS_KEY: ${INTEGRATION_CREDENTIALS_KEY:?INTEGRATION_CREDENTIALS_KEY is required}
      INTEGRATION_CREDENTIALS_PREVIOUS_KEY: ${INTEGRATION_CREDENTIALS_PREVIOUS_KEY:-}
      NMS_INTERNAL_TOKEN: ${NMS_INTERNAL_TOKEN:?NMS_INTERNAL_TOKEN is required}
      NMS_BACKEND_URL: http://nms:8500
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      # Production security headers
      STRICT_MODE: "true"
      FORTIGATE_LEGACY_WRITES_ENABLED: ${FORTIGATE_LEGACY_WRITES_ENABLED:-false}
    ports:
      - "${EXPOSE_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - infrascope-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/ready"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /app/.next/cache
      - /tmp

  nms:
    build:
      context: .
      dockerfile: nms_service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      NMS_ENV: production
      NMS_BACKUP_WORKERS: ${NMS_BACKUP_WORKERS:-2}
      NMS_INTERNAL_TOKEN: ${NMS_INTERNAL_TOKEN:?NMS_INTERNAL_TOKEN is required}
      INTEGRATION_CREDENTIALS_KEY: ${INTEGRATION_CREDENTIALS_KEY:?INTEGRATION_CREDENTIALS_KEY is required}
      INTEGRATION_CREDENTIALS_PREVIOUS_KEY: ${INTEGRATION_CREDENTIALS_PREVIOUS_KEY:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./backups:/recovery
      - ./certs:/app/certs:ro
      - nms_logs_prod:/app/logs
    networks:
      - infrascope-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  database-backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      PGPASSWORD: ${DB_PASSWORD}
      DB_BACKUP_INTERVAL_SECONDS: ${DB_BACKUP_INTERVAL_SECONDS:-86400}
      DB_BACKUP_RETENTION_DAYS: ${DB_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups/database:/var/lib/postgresql/backups
      - ./docker/postgres-backup.sh:/backup-script.sh:ro
    entrypoint: ["/bin/sh", "-c", "sed 's/\\r$//' /backup-script.sh > /tmp/backup.sh; exec sh /tmp/backup.sh --loop"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - infrascope-network
    healthcheck:
      test: ["CMD", "sh", "/tmp/backup.sh", "--health"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Reverse Proxy (Caddy) - Optional but recommended for production
  # caddy:
  #   image: caddy:latest-alpine
  #   container_name: infrascope-caddy-prod
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data_prod:/data
  #     - caddy_config_prod:/config
  #   networks:
  #     - infrascope-network
  #   depends_on:
  #     - web

  # Optional: Redis for caching (production)
  # redis:
  #   image: redis:7-alpine
  #   container_name: infrascope-redis-prod
  #   restart: always
  #   command: redis-server --requirepass ${REDIS_PASSWORD}
  #   volumes:
  #     - redis_data_prod:/data
  #   networks:
  #     - infrascope-network
  #   security_opt:
  #     - no-new-privileges:true

# Networks
networks:
  infrascope-network:
    driver: bridge
    name: ${INFRASCOPE_CONTAINER_PREFIX:-infrascope}-network

# Volumes
volumes:
  nms_logs_prod:
  postgres_data_prod:
    name: ${INFRASCOPE_CONTAINER_PREFIX:-infrascope}-postgres-data-prod
    driver: local
  # caddy_data_prod:
  #   name: infrascope-caddy-data-prod
  #   driver: local
  # caddy_config_prod:
  #   name: infrascope-caddy-config-prod
  #   driver: local
  # redis_data_prod:
  #   name: infrascope-redis-data-prod
  #   driver: local

