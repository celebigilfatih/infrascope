<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34C759;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#28A745;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Green Rounded Square Background with Shadow -->
  <rect x="20" y="20" width="160" height="160" rx="30" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- White Waveform/Heartbeat - Larger Version -->
  <path d="M40 100 L55 100 L65 60 L80 140 L95 40 L110 160 L125 80 L140 100 L160 100" 
        stroke="white" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Small "IS" text at bottom -->
  <text x="100" y="165" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        fill="white" 
        text-anchor="middle" 
        opacity="0.8">InfraScope</text>
</svg>