# InfraScope On-Premise Deployment
# Customer Docker Compose Configuration
#
# Usage:
#   1. Run ./install.sh
#   2. Access ${APP_URL:-http://localhost:8170}/setup
#
# For support: support@infrascope.com

services:
  # ── PostgreSQL Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infrascope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-infrascope}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrascope}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infrascope-net

  # ── InfraScope Application ───────────────────────────────────────
  app:
    image: ${REGISTRY:-ghcr.io/celebigilfatih}/infrascope:${VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-infrascope}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-infrascope}
      
      # License Configuration (REQUIRED)
      LICENSE_KEY: ${LICENSE_KEY}
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-https://lisans.webmahsul.com.tr}
      LICENSE_CACHE_PATH: /app/.license-cache
      MACHINE_ID_PATH: /app/.machine-id
      
      # Authentication
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8170}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      INTEGRATION_CREDENTIALS_KEY: ${INTEGRATION_CREDENTIALS_KEY:?INTEGRATION_CREDENTIALS_KEY is required}
      INTEGRATION_CREDENTIALS_PREVIOUS_KEY: ${INTEGRATION_CREDENTIALS_PREVIOUS_KEY:-}
      NMS_INTERNAL_TOKEN: ${NMS_INTERNAL_TOKEN:?NMS_INTERNAL_TOKEN is required}
      NMS_BACKEND_URL: http://nms:8500
      
      # Application
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-InfraScope}
      NEXT_PUBLIC_APP_VERSION: ${VERSION:-1.0.0}
      APP_VERSION: ${VERSION:-1.0.0}
      
      # Optional: SNMP Community (for network devices)
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}

      # Optional: trusted CA certificates for self-signed infrastructure TLS.
      FORTIANALYZER_TLS_CA_CERT_PATH: ${FORTIANALYZER_TLS_CA_CERT_PATH:-}
      FORTIGATE_TLS_CA_CERT_PATH: ${FORTIGATE_TLS_CA_CERT_PATH:-}
      VMWARE_TLS_CA_CERT_PATH: ${VMWARE_TLS_CA_CERT_PATH:-}
      FORTIGATE_LEGACY_WRITES_ENABLED: ${FORTIGATE_LEGACY_WRITES_ENABLED:-false}
      FORTIGATE_REQUEST_TIMEOUT_MS: ${FORTIGATE_REQUEST_TIMEOUT_MS:-15000}
      
    ports:
      - "${APP_PORT:-8170}:3000"
    volumes:
      # Persist machine ID for license activation
      - ./data/machine-id:/app/.machine-id
      # License cache for offline grace period
      - ./data/license-cache:/app/.license-cache
      # Application logs
      - ./logs:/app/logs
      # Optional trusted CA certificates for FortiAnalyzer/FortiGate/vCenter
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - infrascope-net

  nms:
    image: ${REGISTRY:-ghcr.io/celebigilfatih}/infrascope-nms:${VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-infrascope}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-infrascope}
      NMS_ENV: production
      NMS_BACKUP_WORKERS: ${NMS_BACKUP_WORKERS:-2}
      NMS_INTERNAL_TOKEN: ${NMS_INTERNAL_TOKEN:?NMS_INTERNAL_TOKEN is required}
      INTEGRATION_CREDENTIALS_KEY: ${INTEGRATION_CREDENTIALS_KEY:?INTEGRATION_CREDENTIALS_KEY is required}
      INTEGRATION_CREDENTIALS_PREVIOUS_KEY: ${INTEGRATION_CREDENTIALS_PREVIOUS_KEY:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - nms_logs:/app/logs
      - ./backups:/recovery
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - infrascope-net

  database-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-infrascope}
      POSTGRES_DB: ${POSTGRES_DB:-infrascope}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_BACKUP_INTERVAL_SECONDS: ${DB_BACKUP_INTERVAL_SECONDS:-86400}
      DB_BACKUP_RETENTION_DAYS: ${DB_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups/database:/var/lib/postgresql/backups
      - ./postgres-backup.sh:/backup-script.sh:ro
    entrypoint: ["/bin/sh", "-c", "sed 's/\\r$//' /backup-script.sh > /tmp/backup.sh; exec sh /tmp/backup.sh --loop"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "/tmp/backup.sh", "--health"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - infrascope-net

volumes:
  nms_logs:
  postgres_data:
    driver: local

networks:
  infrascope-net:
    driver: bridge
