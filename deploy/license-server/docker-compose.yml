# InfraScope Central License Server Deployment
#
# This compose file is for the InfraScope operator only. Do not ship it to
# customer on-premise installations.
#
# Database mode:
# - Uses an existing PostgreSQL server.
# - Does not start a PostgreSQL container.

services:
  app:
    image: ${REGISTRY:-registry.infrascope.com}/infrascope:${VERSION:-1.0.0}
    container_name: infrascope-license-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}

      NODE_ENV: production
      DEPLOYMENT_MODE: license-server
      LICENSE_SERVER_MODE: "true"
      LICENSE_JWT_SECRET: ${LICENSE_JWT_SECRET:?LICENSE_JWT_SECRET is required}

      APP_URL: ${APP_URL:-https://lisans.webmahsul.com.tr}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://lisans.webmahsul.com.tr}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-InfraScope License Server}
      NEXT_PUBLIC_APP_VERSION: ${VERSION:-1.0.0}
      APP_VERSION: ${VERSION:-1.0.0}

      FORTIANALYZER_TLS_CA_CERT_PATH: ${FORTIANALYZER_TLS_CA_CERT_PATH:-}
      FORTIGATE_TLS_CA_CERT_PATH: ${FORTIGATE_TLS_CA_CERT_PATH:-}
      VMWARE_TLS_CA_CERT_PATH: ${VMWARE_TLS_CA_CERT_PATH:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./logs:/app/logs
      # Optional trusted CA certificates. Usually not needed for license-server mode.
      - ./certs:/app/certs:ro
    extra_hosts:
      # Lets the container reach PostgreSQL installed on the Docker host.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - license-net

networks:
  license-net:
    driver: bridge
