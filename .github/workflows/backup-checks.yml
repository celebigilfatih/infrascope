name: Configuration backup checks

on:
  workflow_call:
  pull_request:
    paths:
      - 'nms_service/**'
      - 'lib/nms/**'
      - 'lib/security/**'
      - 'lib/alarms/**'
      - 'app/api/health/**'
      - 'scripts/check-alarm-health.cjs'
      - 'lib/prisma.ts'
      - 'app/api/integrations/nms/**'
      - 'app/integrations/nms/**'
      - 'prisma/**'
      - 'scripts/check-nms-*.cjs'
      - 'package*.json'
      - 'deploy/**'
      - 'docker/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'scripts/*backup*'
      - 'scripts/package-*.sh'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-ci-only
          POSTGRES_DB: infrascope_backup_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d infrascope_backup_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fixture:fixture-ci-only@localhost:5432/infrascope_backup_tests
      NMS_LOG_DIR: /tmp/infrascope-backup-test-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nms_service/requirements.txt
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate && npx prisma migrate deploy
      - run: npm run type-check
      - run: npm run test:nms-backups
      - run: npm run test:alarm-health
      - run: npm run security:credentials-check
      - run: pip install -r nms_service/requirements.txt
      - run: python -m nms_service.tests.run_backups
      - name: Verify customer distribution archives
        run: |
          VERSION=1.0.0 bash scripts/package-customer-deploy.sh
          VERSION=1.0.0 bash scripts/package-appliance-assets.sh
          python scripts/check-nms-deploy-package.py
      - name: Check changed backup modules
        run: >-
          npx next lint --file lib/prisma.ts --file lib/nms/backup-platform.ts
          --file lib/nms/backup-service.ts --file app/integrations/nms/backups/page.tsx
          --file 'app/integrations/nms/devices/[id]/page.tsx'
          --file lib/alarms/queries/nms.ts --file lib/alarms/queries/base.ts
