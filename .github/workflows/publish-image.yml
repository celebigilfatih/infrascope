name: Publish InfraScope Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version, for example 1.0.0'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/infrascope-customer

permissions:
  contents: read

concurrency:
  group: customer-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  backup-checks:
    uses: ./.github/workflows/backup-checks.yml
  release-quality:
    uses: ./.github/workflows/release-quality.yml
  alarm-checks:
    uses: ./.github/workflows/alarm-occurrence-checks.yml
  dashboard-checks:
    uses: ./.github/workflows/dashboard-checks.yml
  incident-checks:
    uses: ./.github/workflows/incident-regression.yml
  customer-deployment:
    uses: ./.github/workflows/customer-deployment.yml
  publish:
    needs: [release-quality, alarm-checks, dashboard-checks, incident-checks, backup-checks, customer-deployment]
    name: Publish pinned images and customer installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable release source
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Use a stable pinned version'; exit 1; }
          test "$(git rev-parse "refs/tags/v$VERSION^{commit}")" = "$GITHUB_SHA" || { echo 'Dispatch from the release tag, not a branch'; exit 1; }
          STATUS=$(curl --silent --show-error --output /tmp/existing-release.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")
          test "$STATUS" = 404 || { echo "Release exists or GitHub is unavailable (HTTP $STATUS); refusing replacement"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/infrascope-customer" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          build-args: |
            RELEASE_VERSION=${{ steps.release.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and push NMS service
        id: nms
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nms_service/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.release.outputs.image }}-nms:${{ steps.release.outputs.version }}
          build-args: |
            RELEASE_VERSION=${{ steps.release.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Resolve PostgreSQL and package the online Windows installer
        env:
          VERSION: ${{ steps.release.outputs.version }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          NMS_DIGEST: ${{ steps.nms.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 postgres:16-alpine
          POSTGRES_REF=$(docker image inspect postgres:16-alpine --format '{{index .RepoDigests 0}}')
          python3 scripts/package-online-release.py --version "$VERSION" --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" --app-digest "$APP_DIGEST" --nms-digest "$NMS_DIGEST" \
            --postgres-digest "${POSTGRES_REF##*@}" --output dist/online
      - name: Set up Node for customer guides
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Set up Python for customer guide verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the published app runtime offline
        env:
          APP_IMAGE: ${{ steps.release.outputs.image }}@${{ steps.app.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$APP_IMAGE"
          node scripts/check-production-image.mjs "$APP_IMAGE" "$VERSION"
      - name: Install customer guide rendering tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --legacy-peer-deps
          npx --no-install playwright install --with-deps chromium
          python -m pip install -r scripts/customer-guides-requirements.txt
      - name: Build and verify versioned HTML and PDF guides
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/build-customer-guides.py --release-dir dist/online --output dist/online \
            --version "$VERSION" --repository "$GITHUB_REPOSITORY" --release-date "$(date -u +%F)"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --verify-tag --title "InfraScope $VERSION" --notes-file "dist/online/release-notes-$VERSION.md" \
            "dist/online/infrascope-windows-online-$VERSION.zip" \
            dist/online/install-infrascope.ps1 "dist/online/SHA256SUMS-online-$VERSION.txt" \
            "dist/online/InfraScope-$VERSION-Windows11-Kurulum-Kilavuzu.html" \
            "dist/online/InfraScope-$VERSION-Windows11-Kurulum-Kilavuzu.pdf" \
            "dist/online/SHA256SUMS-guides-$VERSION.txt"
