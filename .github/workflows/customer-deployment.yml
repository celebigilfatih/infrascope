name: Customer deployment checks

on:
  workflow_call:
  pull_request:
    paths:
      - 'deploy/**'
      - 'docker/**'
      - 'scripts/*release*'
      - 'scripts/*guide*'
      - 'docs/releases/**'
      - 'scripts/check-windows-*.ps1'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  guides:
    name: HTML and PDF release guide regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering and PDF verification tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          python -m pip install -r scripts/customer-guides-requirements.txt
      - name: Verify two release versions, repositories, commands and PDFs
        run: python scripts/check-customer-guides.py --integration
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check-online-release.py
      - run: python scripts/check-customer-release-package.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate synthetic release (never published)
        shell: pwsh
        run: >-
          python scripts/package-online-release.py --version 1.0.2 --repository celebigilfatih/infrascope
          --revision aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --app-digest sha256:1111111111111111111111111111111111111111111111111111111111111111
          --nms-digest sha256:2222222222222222222222222222222222222222222222222222222222222222
          --postgres-digest sha256:3333333333333333333333333333333333333333333333333333333333333333
          --output fixture
      - name: Versioned guide and Windows PowerShell 5.1 command checks
        run: python scripts/check-customer-guides.py
      - name: Windows PowerShell 5.1 release failure/retry and state preservation
        shell: powershell
        run: ./scripts/check-windows-update.ps1 -FixtureZip fixture/infrascope-windows-online-1.0.2.zip
      - name: PowerShell 7 release failure/retry and state preservation
        shell: pwsh
        run: ./scripts/check-windows-update.ps1 -FixtureZip fixture/infrascope-windows-online-1.0.2.zip
