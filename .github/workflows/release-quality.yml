name: Release quality checks

on:
  workflow_call:
  pull_request:
    paths:
      - 'next.config.js'
      - '.eslintrc*'
      - 'tsconfig.json'
      - 'package*.json'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'nms_service/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run test:release-quality
      - run: npm run test:dependency-security
      - run: npm run test:local-fonts
      - run: npm run test:topology-contracts
      - run: npm run test:release-compiler
      - run: npm run quality:release
