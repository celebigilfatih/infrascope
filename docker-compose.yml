# ============================================================================
# InfraScope - Docker Compose Configuration (Development)
# ============================================================================

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: infrascope-db-dev
    environment:
      POSTGRES_USER: ${DB_USER:-infrascope}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-infrascope-dev}
      POSTGRES_DB: ${DB_NAME:-infrascope}
    volumes:
      # Named volume for persistent data
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - infrascope-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-infrascope}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Removed: -c log_statement=all (causes significant I/O overhead)

  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: infrascope-web-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-infrascope}:${DB_PASSWORD:-infrascope-dev}@db:5432/${DB_NAME:-infrascope}
      NEXTAUTH_URL: http://localhost:3170
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      NEXT_PUBLIC_API_URL: http://localhost:3170
      INTERNAL_API_URL: http://localhost:3000
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      # NMS Python sidecar (FastAPI on port 8500, internal Docker DNS)
      NMS_BACKEND_URL: ${NMS_BACKEND_URL:-http://nms:8500}
    ports:
      - "8170:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - infrascope-network
    volumes:
      # Source code for development with hot reload
      - .:/app
      # Exclude node_modules to prevent conflicts
      - /app/node_modules
      # Exclude .next to prevent build conflicts
      - /app/.next
    extra_hosts:
      # Enable host.docker.internal on Linux; on Mac it's built-in but harmless
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed 's/\r$//' /app/scripts/entrypoint.sh > /tmp/infrascope-entrypoint.sh
        exec sh /tmp/infrascope-entrypoint.sh "$@"
      - --
    command: npm run dev

  # NMS Service — SNMP polling + network discovery sidecar
  nms:
    build:
      context: .
      dockerfile: nms_service/Dockerfile
    container_name: infrascope-nms-dev
    environment:
      DATABASE_URL: postgresql://${DB_USER:-infrascope}:${DB_PASSWORD:-infrascope-dev}@db:5432/${DB_NAME:-infrascope}
      NMS_ENV: development
      NMS_DEBUG: "false"
      NMS_LOG_LEVEL: INFO
      SNMP_TIMEOUT: "3"
      SNMP_RETRIES: "1"
      INTERFACE_POLL_INTERVAL: "30"
      CPU_MEMORY_POLL_INTERVAL: "300"
      INVENTORY_POLL_INTERVAL: "3600"
      TOPOLOGY_POLL_INTERVAL: "3600"
      CPU_THRESHOLD: "80.0"
      MEMORY_THRESHOLD: "80.0"
      TEMPERATURE_THRESHOLD: "80.0"
      NMS_API_PORT: "8500"
    ports:
      - "8500:8500"   # Internal FastAPI — accessible from host for debug
    depends_on:
      db:
        condition: service_healthy
    networks:
      - infrascope-network
    volumes:
      - nms_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional: Redis for caching and WebSocket support (future)
  #   image: redis:7-alpine
  #   container_name: infrascope-redis-dev
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - infrascope-network
  #   volumes:
  #     - redis_data_dev:/data
  #   restart: unless-stopped

# Networks
networks:
  infrascope-network:
    driver: bridge
    name: infrascope-network

# Volumes
volumes:
  postgres_data_dev:
    name: infrascope-postgres-data-dev
    driver: local
  nms_logs:
    name: infrascope-nms-logs
    driver: local
  # redis_data_dev:
  #   name: infrascope-redis-data-dev
  #   driver: local

# ============================================================================
# Usage:
# docker compose up -d              # Start all services
# docker compose down               # Stop all services
# docker compose logs -f            # View logs
# docker compose exec db psql       # Access PostgreSQL
# docker compose exec web bash      # Access container shell
# ============================================================================
